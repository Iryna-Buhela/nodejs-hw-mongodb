tags:
  - Auth
summary: Get Google OAuth URL
description: Retrieve Google OAuth authorization URL for frontend redirect
operationId: getGoogleOAuthUrl
security: []
responses:
  '200':
    description: OAuth URL generated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully generated Google OAuth URL
            data:
              type: object
              properties:
                url:
                  type: string
                  example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
  '400':
    description: Failed to generate Google OAuth URL
