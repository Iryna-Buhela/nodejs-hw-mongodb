tags:
  - Auth
summary: Log in user
operationId: loginUser
description: 'Authenticate a user and return access and refresh tokens'
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            example: 'sarah@gmail.com'
          password:
            type: string
            example: 'qwerty12345'
responses:
  '200':
    description: Successfully logged in
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                refreshToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                user:
                  type: object
                  properties:
                    _id:
                      type: string
                      example: 65e4decdd286b30065d54af9
                    email:
                      type: string
                      example: 'sarah@gmail.com'
  '401':
    $ref: ../../components/responses/401.yaml
